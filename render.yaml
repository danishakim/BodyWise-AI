services:
  - type: web
    name: bodywise-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker so the in-memory rate limits and daily AI cap are exact; threads handle concurrency.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/status
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: TM_MODEL_URL
        value: https://teachablemachine.withgoogle.com/models/gNZ_wz1dv/
      - key: TRUST_PROXY
        value: "1"
      - key: AI_RATE_LIMIT_PER_MIN
        value: "10"
      - key: AI_DAILY_PER_IP
        value: "50"
      - key: AI_DAILY_CAP
        value: "500"
      - key: PYTHON_VERSION
        value: 3.12.7
